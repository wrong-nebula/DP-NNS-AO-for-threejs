precision highp float;

float sdBox(vec3 q,vec3 h){

float sdMesh(vec3 q,vec4 k){

  #endif

      // and R_k-.045 (where occlusion clamps to 0). The bounding sphere gives a lower bound
      // per tap, so only taps that pass it fetch the atlas.

const bakeVertexShader=`void main(){gl_Position=vec4(position.xy,0.,1.);}`;
const bakeFragmentShader=`
precision highp float;
uniform highp sampler2D tris;
uniform int triCount;
uniform int texW;
uniform float halfSize;
uniform float layer;
uniform vec3 meshHalf; // half extents of a centred box containing the mesh
out vec4 o;

float dot2(vec3 v){return dot(v,v);}

  // directions, so the total solid angle is below 2pi and |winding| < .5: the sign is outside.
  // Only voxels inside the box need the winding term.
  bool inBox=all(lessThanEqual(abs(p),meshHalf));
  for(int t=0;t<triCount;t++){
    vec3 a=vert(3*t),b=vert(3*t+1),c=vert(3*t+2);
    vec3 ba=b-a,pa=p-a,cb=c-b,pb=p-b,ac=a-c,pc=p-c,nor=cross(ba,ac);
    if(dot2(nor)<1e-14)continue; // degenerate (e.g. sphere poles): covered by neighbours
    d2=min(d2,(sign(dot(cross(ba,nor),pa))+sign(dot(cross(cb,nor),pb))+sign(dot(cross(ac,nor),pc))<2.)
      ?min(min(dot2(ba*clamp(dot(ba,pa)/dot2(ba),0.,1.)-pa),
               dot2(cb*clamp(dot(cb,pb)/dot2(cb),0.,1.)-pb)),
               dot2(ac*clamp(dot(ac,pc)/dot2(ac),0.,1.)-pc))
      :dot(nor,pa)*dot(nor,pa)/dot2(nor));
    if(inBox){
      vec3 A=-pa,B=-pb,C=-pc;
      float la=length(A),lb=length(B),lc=length(C);
      w+=atan(dot(A,cross(B,C)),la*lb*lc+dot(A,B)*lc+dot(B,C)*la+dot(C,A)*lb);
    }

  float winding=w/6.283185307;
  o=vec4(abs(winding)>.5?-sqrt(d2):sqrt(d2));
}`;

    tex.format=T.RedFormat;tex.type=T.HalfFloatType;
    tex.minFilter=tex.magFilter=T.LinearFilter;tex.generateMipmaps=false;
    let tris=0;
    list.forEach((m,slab)=>{tris+=bakeMover(m,slab,target);});
    renderer.setRenderTarget(null);
    return {target,tex,tris};
  }
  const bakeStart=performance.now();
  const bgl=renderer.getContext(),btimer=bgl.getExtension('EXT_disjoint_timer_query_webgl2');
  const bakeQuery=btimer?bgl.createQuery():null; if(bakeQuery)bgl.beginQuery(btimer.TIME_ELAPSED_EXT,bakeQuery);
  function bakeMover(m,slab,atlasTarget){
    const pos=(m.geometry.index?m.geometry.toNonIndexed():m.geometry).attributes.position;
    const triCount=pos.count/3, texW=1024, texH=Math.ceil(pos.count/texW);
    const data=new Float32Array(texW*texH*4);
    for(let i=0;i<pos.count;i++)data.set([pos.getX(i),pos.getY(i),pos.getZ(i),0],i*4);
    const tris=new T.DataTexture(data,texW,texH,T.RGBAFormat,T.FloatType);
    tris.needsUpdate=true;
    const halfSize=Math.max(...m.half)+MESH_PAD;
    const u=bakeMaterial.uniforms;
    u.tris.value=tris;u.triCount.value=triCount;u.texW.value=texW;u.halfSize.value=halfSize;u.meshHalf.value.set(...m.half);
    for(let z=0;z<MESH_RES;z++){
      bakeMaterial.uniforms.layer.value=z;
      renderer.setRenderTarget(atlasTarget,slab*MESH_RES+z);
      quad.render(renderer);
    }
    m.meshParam=new T.Vector4(slab,halfSize,0,0);
    if(m.type===6)m.analyticParam=m.meshParam;
    tris.dispose();
    return triCount;
  }
  for(const m of movers)if(m.type!==6)m.analyticParam=new T.Vector4(...m.param);
  const meshMovers=movers.filter(m=>m.type===6);
  let baked=bakeAtlas(meshMovers),bakedAll=false,totalTris=baked.tris;
  const atlasTarget=baked.target,atlas=baked.tex;
  if(bakeQuery)bgl.endQuery(btimer.TIME_ELAPSED_EXT);
  renderer.getContext().finish();
  const bakeMs=performance.now()-bakeStart;
  // Benchmark: GPU elapsed time of the bake, and wall time until a readback forces completion.
  {const px=new Float32Array(4);renderer.readRenderTargetPixels(atlasTarget,0,0,1,1,px);}
  const bakeSyncMs=performance.now()-bakeStart;
  const bakeGpuMs=new Promise(ok=>{const poll=()=>{if(!bakeQuery)return ok(NaN);if(bgl.getQueryParameter(bakeQuery,bgl.QUERY_RESULT_AVAILABLE))return ok(bgl.getQueryParameter(bakeQuery,bgl.QUERY_RESULT)/1e6);setTimeout(poll,5);};poll();});

  const variants=[0,4,14,34,32,36];
  const mask={value:false};
  const dyn={
    dynInv:{value:Array.from({length:MAX_DYN},()=>new T.Matrix4())},
    dynParam:{value:Array.from({length:MAX_DYN},()=>new T.Vector4())},
    dynType:{value:new Array(MAX_DYN).fill(0)},
    dynSphere:{value:Array.from({length:MAX_DYN},()=>new T.Vector4())},
    dynCount:{value:0},
    meshAtlas:{value:atlas},
    moverCells:{value:null},
    meshSlabs:{value:Math.max(1,meshMovers.length)},
    // 0.5: fitted against the ray-traced reference with all 11 movers (4 poses), confirmed on 4
    // held-out poses: AO error near movers 0.097 -> 0.050; 1 = the full, distance-only occlusion.
    moverScale:{value:new T.Vector4(.5,.5,.5,.5)}
  };
  // Two compiled variants per mode: with mover code, and without it (NO_DYN) for when no mover
  // is in the AO, so the static path carries none of the mover loops.
  const makeMaterials=extra=>Object.fromEntries(variants.map(mode=>[mode,new T.ShaderMaterial({
    glslVersion:T.GLSL3,vertexShader,fragmentShader,
    defines:{...(mode===34?{FAST:1,CONTACT:1}:mode===14?{FAST:1}:{TAPS:mode}),...extra},
    uniforms:{field:{value:field},showMask:mask,...dyn}
  })]));
  const materials=makeMaterials({}),staticMaterials=makeMaterials({NO_DYN:1});
  if(!boxes.length||boxes.some(b=>b.length!==6||b.some(v=>!Number.isFinite(v))))throw Error('Invalid geometry');
  const mesh=new T.InstancedMesh(new T.BoxGeometry(1,1,1),materials[0],boxes.length);
  const walls=new Float32Array(boxes.length);
  walls[1]=walls[2]=1;
  mesh.geometry.setAttribute('wall',new T.InstancedBufferAttribute(walls,1));
  mesh.geometry.setAttribute('selfSkip',new T.InstancedBufferAttribute(new Float32Array(boxes.length).fill(-1),1));
  mesh.geometry.setAttribute('boundsHalf',new T.InstancedBufferAttribute(new Float32Array(boxes.length*3).fill(.5),3));
  const matrix=new T.Matrix4();
  boxes.forEach(([x,y,z,hx,hy,hz],i)=>mesh.setMatrixAt(i,matrix.makeScale(2*hx,2*hy,2*hz).setPosition(x,y,z)));
  scene.add(mesh);
  // Each mover is drawn as a one-instance InstancedMesh so it shares the scene shader.
  for(const m of movers){
    m.geometry.setAttribute('wall',new T.InstancedBufferAttribute(new Float32Array([0]),1));
    m.geometry.setAttribute('selfSkip',new T.InstancedBufferAttribute(new Float32Array([m.type<=4?movers.indexOf(m):-1]),1));
    m.geometry.setAttribute('boundsHalf',new T.InstancedBufferAttribute(new Float32Array(m.half),3));
    m.object=new T.InstancedMesh(m.geometry,materials[0],1);
    m.object.instanceMatrix.setUsage(T.DynamicDrawUsage);
    m.object.frustumCulled=false;
    scene.add(m.object);
  }
  // First use of "Baked SDF for all movers": bake every mover into a new atlas and swap it in.
  function ensureAllBaked(){
    if(bakedAll)return;
    const old=baked.target;
    baked=bakeAtlas(movers);bakedAll=true;
    dyn.meshAtlas.value=baked.tex;dyn.meshSlabs.value=movers.length;
    old.dispose();quad.dispose();bakeMaterial.dispose();
  }
  // 1 m world cells over the static field's box (lo -1, span 26 x 18 x 8), one bit per mover.
  const CELLS=[26,18,8],cellBits=new Uint32Array(CELLS[0]*CELLS[1]*CELLS[2]);
  const cellTex=new T.Data3DTexture(cellBits,...CELLS);
  cellTex.format=T.RedIntegerFormat;cellTex.type=T.UnsignedIntType;cellTex.internalFormat='R32UI';
  cellTex.minFilter=cellTex.magFilter=T.NearestFilter;cellTex.unpackAlignment=1;cellTex.needsUpdate=true;
  dyn.moverCells.value=cellTex;
  function fillCells(){
    cellBits.fill(0);
    movers.forEach((m,i)=>{
      const s=dyn.dynSphere.value[i],reach=s.w+1.12+(1.12-.044)+1e-3;
      const c=[s.x+1,s.y+1,s.z+1],lo=[],hi=[];
      for(let k=0;k<3;k++){lo[k]=Math.max(0,Math.floor(c[k]-reach));hi[k]=Math.min(CELLS[k]-1,Math.floor(c[k]+reach));}
      for(let z=lo[2];z<=hi[2];z++)for(let y=lo[1];y<=hi[1];y++)for(let x=lo[0];x<=hi[0];x++){
        const dx=Math.max(x-c[0],0,c[0]-x-1),dy=Math.max(y-c[1],0,c[1]-y-1),dz=Math.max(z-c[2],0,c[2]-z-1);
        if(dx*dx+dy*dy+dz*dz<reach*reach)cellBits[(z*CELLS[1]+y)*CELLS[0]+x]|=1<<i;
      }
    });
    cellTex.needsUpdate=true;
  }
  const rigid=new T.Matrix4(),euler=new T.Euler();
  let dynamicAO=true,animate=true,forceMesh=false,simTime=0,lastNow=0;
  function updateMovers(t){
    movers.forEach((m,i)=>{
      const {x,y,z,rx=0,ry=0,rz=0}=m.pose(t);
      rigid.makeRotationFromEuler(euler.set(rx,ry,rz,'ZYX')).setPosition(x,y,z);
      dyn.dynInv.value[i].copy(rigid).invert();
      dyn.dynType.value[i]=forceMesh?6:m.type;
      dyn.dynParam.value[i].copy(forceMesh?m.meshParam:m.analyticParam);
      dyn.dynSphere.value[i].set(x,y,z,m.radius);
      m.object.setMatrixAt(0,rigid);
      m.object.instanceMatrix.needsUpdate=true;
    });
    dyn.dynCount.value=dynamicAO?movers.length:0;
    fillCells();
  }
  updateMovers(0);
  const radius=1.12;
  // Seed Three.js's SSAO kernel and noise texture for reproducible captures.
  const originalRandom=Math.random;
  let seed=2804;
  let ssao;
  try {
    Math.random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
    ssao=new SSAOPass(scene,camera,W,H,32);
  } finally {Math.random=originalRandom;}
  ssao.kernelRadius=radius;
  ssao.minDistance=.045/(camera.far-camera.near);
  ssao.maxDistance=radius/(camera.far-camera.near);

  const gtao=new GTAOPass(scene,camera,W,H);
  gtao.updateGtaoMaterial({radius,screenSpaceRadius:false,thickness:radius});
  // Run the built-in passes through denoising, then use the same ambient lighting
  // equation in the final geometry draw for all methods.
  ssao.output=SSAOPass.OUTPUT.Blur;
  const renderSsaoPass=ssao.renderPass.bind(ssao);
  ssao.renderPass=(r,material,...args)=>{
    if(material!==ssao.copyMaterial)renderSsaoPass(r,material,...args);
  };
  gtao.output=GTAOPass.OUTPUT.Off;
  const scratch=new T.WebGLRenderTarget(W,H,{depthBuffer:false});
  const screenMaterial=new T.ShaderMaterial({
    glslVersion:T.GLSL3,vertexShader,fragmentShader,
    defines:{TAPS:0,SCREEN_AO:1},uniforms:{aoMap:{value:null},showMask:mask,...dyn}
  });
  const controls=new OrbitControls(camera,renderer.domElement);
  controls.target.set(10.8,8.8,1.4);
  controls.minDistance=1.5;
  controls.maxDistance=45;
  controls.update();
  renderer.domElement.setAttribute('aria-label','3D Archive test scene with stairs, shelves, walls and moving objects');
  function setMaterial(material){
    mesh.material=material;
    for(const m of movers)m.object.material=material;
  }
  function render(taps){
    if(taps===32||taps===36){
      const pass=taps===32?ssao:gtao;
      pass.render(renderer,scratch,scratch);

      setMaterial(screenMaterial);

    renderer.setRenderTarget(null);
    renderer.render(scene,camera);
  }
  const buttons=[...document.querySelectorAll('button[data-taps]')];
  const fpsValue=document.querySelector('#fps-value');
  const frameMs=document.querySelector('#frame-ms');
  const bakeNote=` · baked ${meshMovers.length} mesh SDFs (${MESH_RES}³, ${totalTris.toLocaleString()} triangles) in ${bakeSyncMs.toFixed(0)} ms`;
  let selected=14;
  let started=0;
  let frames=0;
  function resetFps(){
    started=0;
    frames=0;
    fpsValue.textContent='— FPS';
    frameMs.textContent='Measuring…';
  }
  function select(mode){
    selected=mode;
    buttons.forEach(button=>button.setAttribute('aria-pressed',Number(button.dataset.taps)===mode));
    const label=buttons.find(button=>Number(button.dataset.taps)===mode).textContent;
    status.value=label+' · 1280 × 720 · 1.12 m AO radius'+bakeNote;
    resetFps();
  }
  buttons.forEach(button=>button.onclick=()=>select(Number(button.dataset.taps)));
  document.querySelector('#mask').onchange=event=>{mask.value=event.target.checked;resetFps();};
  document.querySelector('#animate').onchange=event=>{animate=event.target.checked;};
  document.querySelector('#dynao').onchange=event=>{dynamicAO=event.target.checked;updateMovers(simTime);resetFps();};
  document.querySelector('#forcemesh').onchange=event=>{forceMesh=event.target.checked;if(forceMesh)ensureAllBaked();updateMovers(simTime);resetFps();};
  // Debug hook for timing from the console.
  window.aoDemo={renderer,camera,controls,render,updateMovers,dyn,movers,bakeMs,bakeSyncMs,bakeGpuMs,totalTris,get atlas(){return baked.tex;},meshRes:MESH_RES,setMask:on=>{mask.value=on;},setMoverScale:(x,y=x,z=x,w=x)=>dyn.moverScale.value.set(x,y,z,w),select:mode=>select(mode),
    setDynamicAO:on=>{dynamicAO=on;updateMovers(simTime);},
    setForceMesh:on=>{forceMesh=on;if(on)ensureAllBaked();updateMovers(simTime);}};
  document.addEventListener('visibilitychange',resetFps);
  select(selected);
  renderer.setAnimationLoop(now=>{
    if(animate&&lastNow)simTime+=Math.min(now-lastNow,100)/1000;
    lastNow=now;
    if(animate)updateMovers(simTime);
    render(selected);
    if(!started){started=now;return;}
    frames++;
    const elapsed=now-started;
    if(elapsed<500)return;
    fpsValue.textContent=(1000*frames/elapsed).toFixed(0)+' FPS';
    frameMs.textContent=(elapsed/frames).toFixed(1)+' ms / frame';
    started=now;
    frames=0;
  });
} catch(error) {
  status.value=error.message;
  throw error;
}
</script>
